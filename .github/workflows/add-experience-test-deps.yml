name: Add MoonWitness Experience Test Dependencies

on:
  push:
    branches:
      - "feat/fasttrack-experience-assurance"
    paths:
      - ".github/workflows/add-experience-test-deps.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add browser assurance dependencies
        run: npm install --save-dev @playwright/test @axe-core/playwright --ignore-scripts --no-audit --no-fund

      - name: Commit dependency files
        run: |
          if [ -z "$(git status --porcelain -- package.json package-lock.json)" ]; then
            echo "Experience test dependencies are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add browser experience test dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
