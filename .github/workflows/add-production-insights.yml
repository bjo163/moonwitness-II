name: Add MoonWitness Production Insights

on:
  push:
    branches:
      - "feat/fasttrack-post-v0.1.0"
    paths:
      - ".github/workflows/add-production-insights.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add Vercel insight dependencies
        run: npm install --workspace apps/web @vercel/analytics @vercel/speed-insights --save --ignore-scripts --no-audit --no-fund

      - name: Commit dependency files
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json apps/web/package.json)" ]; then
            echo "Insight dependencies are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/web/package.json
          git commit -m "chore: add Vercel production insight dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
