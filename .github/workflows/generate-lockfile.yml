name: Generate MoonWitness Lockfile

on:
  push:
    branches: ["feat/phase5b-operational-readiness"]
    paths:
      - "package.json"
      - "apps/web/package.json"
      - ".github/workflows/generate-lockfile.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit package lock
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock operational dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
