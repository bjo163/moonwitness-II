stories:
  - id: story_001
    title: "When The Moon Witness"
    theme: "END OF AN ERA"
    premise: "A signal is noticed. A witness records it. A message travels. The trace begins to pull the present toward the past."
    opening: "Before the story had a name, there was only a signal and someone willing to notice it."
    movement:
      - "Notice the event."
      - "Follow the witness."
      - "Read the message."
      - "Find the fault line."
      - "Expose what can be shown."
      - "Trace what remains."
      - "Ask what deserves to continue."
      - "Move into the next phase."
    ending: "The era closes. The witness remains."
    related_event: event_001
    related_witness: witness_001
    related_message: msg_001
    next_phase: era_07
    status: draft
